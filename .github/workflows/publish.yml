name: Publish to npm (OIDC + provenance)

# Migrated off classic NPM_TOKEN auth on 2026-08-04.
# The original fallback existed because npm's trusted-publisher record for
# fidgetcoding-motion-mcp kept binding to lorecraft-io/morgen-mcp regardless
# of UI edits. The repo has since moved to the fidgetcoding org, so the stale
# binding no longer applies and a fresh TP record resolves cleanly.
# Mirrors morgen-mcp's workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and inspect without publishing'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm to 11+ (required for OIDC trusted-publisher auth)
        run: |
          npm install -g npm@latest
          npm --version
      - run: npm ci
      - run: npm test
        if: hashFiles('test/**', 'tests/**', 'src/**/*.test.*') != ''
      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --provenance --access public
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true
